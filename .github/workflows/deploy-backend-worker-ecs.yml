name: Deploy backend and worker to ECS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infrastructure/terraform/**"
      - ".github/workflows/deploy-backend-worker-ecs.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-worker-ecs-${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'visualkit' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}
  TFVARS_FILE: infrastructure/terraform/${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}.tfvars
  BACKEND_CONFIG: infrastructure/terraform/backend-${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}.hcl

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "$AWS_ACCOUNT_ID" || { echo "Missing repository variable AWS_ACCOUNT_ID"; exit 1; }
          test -n "$ROLE_ARN" || { echo "Missing repository secret AWS_GITHUB_ACTIONS_ROLE_ARN"; exit 1; }
          case "$ENVIRONMENT" in
            development|staging|production) ;;
            *) echo "ENVIRONMENT must be development, staging, or production"; exit 1 ;;
          esac

      - name: Materialize Terraform config from secrets
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}
          BACKEND_CONFIG_CONTENT: ${{ secrets.TERRAFORM_BACKEND_CONFIG }}
        run: |
          if [ ! -f "$TFVARS_FILE" ] && [ -n "$TFVARS_CONTENT" ]; then
            printf '%s\n' "$TFVARS_CONTENT" > "$TFVARS_FILE"
          fi

          if [ ! -f "$BACKEND_CONFIG" ] && [ -n "$BACKEND_CONFIG_CONTENT" ]; then
            printf '%s\n' "$BACKEND_CONFIG_CONTENT" > "$BACKEND_CONFIG"
          fi

          test -f "$TFVARS_FILE" || { echo "Missing $TFVARS_FILE or TERRAFORM_TFVARS secret"; exit 1; }
          test -f "$BACKEND_CONFIG" || { echo "Missing $BACKEND_CONFIG or TERRAFORM_BACKEND_CONFIG secret"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-skip-session-tagging: true
          role-session-name: github-actions-visualkit-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        run: |
          ecr_prefix="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-${ENVIRONMENT}"
          image_tag="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "API_IMAGE=${ecr_prefix}/api:${image_tag}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${ecr_prefix}/worker:${image_tag}" >> "$GITHUB_ENV"

      - name: Verify ECR repositories
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "${PROJECT_NAME}-${ENVIRONMENT}/api" "${PROJECT_NAME}-${ENVIRONMENT}/worker" >/dev/null

      - name: Build API image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "$API_IMAGE" \
            backend

      - name: Build worker image
        run: |
          docker build \
            --file backend/Dockerfile.worker \
            --tag "$WORKER_IMAGE" \
            backend

      - name: Push images
        run: |
          docker push "$API_IMAGE"
          docker push "$WORKER_IMAGE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform -chdir=infrastructure/terraform init \
            -backend-config="$GITHUB_WORKSPACE/$BACKEND_CONFIG"

      - name: Import existing ECR repositories
        run: |
          if ! terraform -chdir=infrastructure/terraform state show aws_ecr_repository.api >/dev/null 2>&1; then
            terraform -chdir=infrastructure/terraform import \
              -var-file="$GITHUB_WORKSPACE/$TFVARS_FILE" \
              -var="aws_region=$AWS_REGION" \
              -var="container_image_api=$API_IMAGE" \
              -var="container_image_worker=$WORKER_IMAGE" \
              aws_ecr_repository.api \
              "${PROJECT_NAME}-${ENVIRONMENT}/api"
          fi

          if ! terraform -chdir=infrastructure/terraform state show aws_ecr_repository.worker >/dev/null 2>&1; then
            terraform -chdir=infrastructure/terraform import \
              -var-file="$GITHUB_WORKSPACE/$TFVARS_FILE" \
              -var="aws_region=$AWS_REGION" \
              -var="container_image_api=$API_IMAGE" \
              -var="container_image_worker=$WORKER_IMAGE" \
              aws_ecr_repository.worker \
              "${PROJECT_NAME}-${ENVIRONMENT}/worker"
          fi

      - name: Terraform apply
        run: |
          terraform -chdir=infrastructure/terraform apply \
            -auto-approve \
            -var-file="$GITHUB_WORKSPACE/$TFVARS_FILE" \
            -var="aws_region=$AWS_REGION" \
            -var="container_image_api=$API_IMAGE" \
            -var="container_image_worker=$WORKER_IMAGE"
